query getProjectsPipelinesTestReportSummary(
    $ids: [ID!]
    $updatedAfter: Time
    $updatedBefore: Time
    $source: String
    $endCursor: String
) {
    projects(ids: $ids, after: $endCursor) {
        nodes {
            ...ProjectReferenceFields

            pipelines(
                scope: FINISHED
                source: $source
                updatedAfter: $updatedAfter
                updatedBefore: $updatedBefore
            ) {
                nodes {
                    ...PipelineReferenceFields

                    testReportSummary {
                        total {
                            ...TestReportSummaryFields
                        }
                        testSuites {
                            nodes {
                                ...TestSuiteSummaryFields
                            }
                            pageInfo {
                                ...pageFields
                            }
                        }
                    }
                }
                pageInfo {
                    ...pageFields
                }
            }
        }
        pageInfo {
            ...pageFields
        }
    }
}

query getProjectPipelinesTestReportSummary(
    $projectPath: ID!
    $updatedAfter: Time
    $updatedBefore: Time
    $source: String
    $endCursor: String
) {
    project(fullPath: $projectPath) {
        ...ProjectReferenceFields

        pipelines(
            scope: FINISHED
            source: $source
            updatedAfter: $updatedAfter
            updatedBefore: $updatedBefore
            after: $endCursor
            ) {
            nodes {
                ...PipelineReferenceFields

                testReportSummary {
                    total {
                        ...TestReportSummaryFields
                    }
                    testSuites {
                        nodes {
                            ...TestSuiteSummaryFields
                        }
                        pageInfo {
                            ...pageFields
                        }
                    }
                }
            }
            pageInfo {
                ...pageFields
            }
        }
    }
}
