fragment JobFieldsCore on CiJob {
    name
    refName
    refPath
    status
    
    createdAt
    queuedAt
    startedAt
    finishedAt
    erasedAt

    duration
    queuedDuration
    coverage

    allowFailure
    failureMessage @minVersion(v: "16.0")
}

fragment JobFieldsExtra on CiJob {
    stage {
        name
    }

    tags

    # @genqlient(pointer: true)
    exitCode @minVersion(v: "17.7")

    manualJob
    retryable
    retried

    kind
    downstreamPipeline {
        ...PipelineReferenceFields
        project {
            ...ProjectReferenceFields
        }
    }

    runner @minVersion(v: "16.0") {
      ...RunnerReferenceFields
    }
}

fragment JobArtifactFieldsCore on CiJobArtifact {
    fileType
    name
    downloadPath
}
